<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>生日快乐 🎂</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a0533 0%, #2d0a5e 40%, #0d1b6e 100%);
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ---- Stars ---- */
    .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--t) infinite ease-in-out;
    }
    @keyframes twinkle {
      0%,100% { opacity: .2; transform: scale(1); }
      50%      { opacity: 1;  transform: scale(1.5); }
    }

    /* ---- Confetti ---- */
    .confetti-wrap { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
    .confetti-piece {
      position: absolute;
      top: -20px;
      width: 10px;
      height: 14px;
      border-radius: 2px;
      opacity: 0;
      animation: fall var(--d) var(--delay) infinite ease-in;
    }
    @keyframes fall {
      0%   { opacity: 1; transform: translateY(0) rotate(0deg)   translateX(0); }
      100% { opacity: 0; transform: translateY(110vh) rotate(720deg) translateX(var(--dx)); }
    }

    /* ---- Main card ---- */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 32px;
      padding: 60px 54px 50px;
      max-width: 580px;
      width: 92%;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.2);
      animation: rise .9s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(60px) scale(.92); }
      to   { opacity: 1; transform: translateY(0)    scale(1);   }
    }

    /* ---- Cake ---- */
    .cake-wrap {
      font-size: 100px;
      line-height: 1;
      animation: bounce 2s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(255,180,0,.7));
      margin-bottom: 20px;
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0);    }
      50%      { transform: translateY(-14px); }
    }

    /* ---- Title ---- */
    .title {
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(90deg, #ffd700, #ff8c00, #ff4da6, #a855f7, #3b82f6, #ffd700);
      background-size: 300% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s linear infinite;
      margin-bottom: 8px;
    }
    @keyframes shimmer { to { background-position: 300% center; } }

    .subtitle {
      font-size: 1.15rem;
      color: rgba(255,255,255,0.75);
      letter-spacing: 2px;
      margin-bottom: 34px;
    }

    /* ---- Candle row ---- */
    .candles {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 34px;
    }
    .candle {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      cursor: pointer;
    }
    .flame {
      width: 14px;
      height: 22px;
      background: radial-gradient(ellipse at 50% 80%, #fff 0%, #ffe259 30%, #ff9800 70%, transparent 100%);
      border-radius: 50% 50% 30% 30%;
      animation: flicker 0.5s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 6px #ff9800);
      transition: opacity .3s;
    }
    .candle-body {
      width: 14px;
      height: 48px;
      border-radius: 4px;
    }
    @keyframes flicker {
      from { transform: scaleX(1)   scaleY(1)    rotate(-2deg); }
      to   { transform: scaleX(.85) scaleY(1.08) rotate(2deg); }
    }
    .candle.blown .flame { opacity: 0; }

    /* ---- Message ---- */
    .message {
      color: rgba(255,255,255,0.9);
      font-size: 1.05rem;
      line-height: 1.9;
      background: rgba(255,255,255,0.07);
      border-radius: 16px;
      padding: 22px 26px;
      margin-bottom: 34px;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .message span { color: #ffd700; font-weight: 700; }

    /* ---- Blow button ---- */
    .btn-blow {
      display: inline-block;
      padding: 14px 44px;
      background: linear-gradient(135deg, #ff6faa, #a855f7, #3b82f6);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 2px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(168,85,247,.4);
      transition: transform .15s, box-shadow .15s;
      animation: pulse-btn 2.5s ease-in-out infinite;
    }
    .btn-blow:hover { transform: scale(1.06); box-shadow: 0 12px 40px rgba(168,85,247,.6); }
    .btn-blow:active { transform: scale(.97); }
    @keyframes pulse-btn {
      0%,100% { box-shadow: 0 8px 32px rgba(168,85,247,.4); }
      50%      { box-shadow: 0 8px 48px rgba(255,111,170,.7); }
    }

    /* ---- Wish popup ---- */
    .wish-popup {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
    }
    .wish-popup.show { display: flex; }
    .wish-box {
      background: linear-gradient(135deg, #1e0840, #0d1b6e);
      border: 2px solid rgba(255,215,0,.4);
      border-radius: 28px;
      padding: 48px 44px;
      max-width: 440px;
      width: 88%;
      text-align: center;
      animation: popIn .5s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes popIn {
      from { opacity:0; transform:scale(.7); }
      to   { opacity:1; transform:scale(1);  }
    }
    .wish-box .big-emoji { font-size: 72px; margin-bottom: 16px; }
    .wish-box h2 {
      font-size: 1.9rem;
      font-weight: 900;
      color: #ffd700;
      margin-bottom: 14px;
    }
    .wish-box p { color: rgba(255,255,255,.85); font-size: 1rem; line-height: 1.8; margin-bottom: 26px; }
    .btn-close {
      padding: 12px 36px;
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      color: #1a0533;
      font-weight: 800;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn-close:hover { filter: brightness(1.1); }

    /* ---- Balloons ---- */
    .balloon {
      position: fixed;
      bottom: -120px;
      font-size: 52px;
      line-height: 1;
      animation: floatUp var(--dur) var(--delay) ease-in infinite;
      z-index: 2;
      pointer-events: none;
    }
    @keyframes floatUp {
      0%   { bottom: -120px; opacity: 1; transform: translateX(0) rotate(0deg); }
      100% { bottom: 110vh;  opacity: 0; transform: translateX(var(--dx)) rotate(var(--rot)); }
    }

    /* ---- Footer ---- */
    .footer { 
      position: relative; z-index: 10; 
      margin-top: 28px; 
      color: rgba(255,255,255,.35); 
      font-size: .8rem; 
      letter-spacing: 1px; 
    }
  </style>
</head>
<body>

<!-- Stars -->
<div class="stars" id="stars"></div>

<!-- Confetti -->
<div class="confetti-wrap" id="confetti"></div>

<!-- Balloons -->
<div id="balloons"></div>

<!-- Main card -->
<div class="card">
  <div class="cake-wrap">🎂</div>
  <div class="title">生 日 快 乐</div>
  <div class="subtitle">✨ Happy Birthday ✨</div>

  <div class="candles" id="candles"></div>

  <div class="message">
    愿今天所有的<span>美好</span>都与你相遇，<br/>
    愿未来每一天都闪耀着你独特的<span>光芒</span>，<br/>
    愿你的笑容如阳光般<span>温暖</span>每一个角落，<br/>
    愿岁月静好，愿你<span>平安喜乐</span>，永远幸福！🌟
  </div>

  <button class="btn-blow" onclick="blowCandles()">🎉 许个愿，吹蜡烛！</button>
</div>

<div class="footer">Made with ❤️ · 送给最棒的你</div>

<!-- Wish popup -->
<div class="wish-popup" id="wishPopup">
  <div class="wish-box">
    <div class="big-emoji">🌠</div>
    <h2>愿望已送达！</h2>
    <p>你的心愿已飞向星空<br/>星星们正在帮你实现它<br/>愿今天是你最美好的一天 🎊</p>
    <button class="btn-close" onclick="closeWish()">谢谢你 💛</button>
  </div>
</div>

<script>
  /* ------- Stars ------- */
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random() * 3 + 1;
    s.style.cssText = `
      width:${sz}px; height:${sz}px;
      left:${Math.random()*100}%;
      top:${Math.random()*100}%;
      --t:${(Math.random()*3+1.5).toFixed(1)}s;
      animation-delay:${(Math.random()*3).toFixed(1)}s;
    `;
    starsEl.appendChild(s);
  }

  /* ------- Confetti ------- */
  const colors = ['#ffd700','#ff6faa','#a855f7','#3b82f6','#34d399','#f97316','#fff'];
  const confWrap = document.getElementById('confetti');
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    const dx = (Math.random() - 0.5) * 300;
    c.style.cssText = `
      left:${Math.random()*100}%;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      --d:${(Math.random()*3+3).toFixed(1)}s;
      --delay:${(Math.random()*5).toFixed(1)}s;
      --dx:${dx.toFixed(0)}px;
      transform:rotate(${Math.random()*360}deg);
    `;
    confWrap.appendChild(c);
  }

  /* ------- Candles ------- */
  const candleColors = ['#ff6faa','#a855f7','#3b82f6','#34d399','#ffd700','#f97316'];
  const candleWrap = document.getElementById('candles');
  for (let i = 0; i < 6; i++) {
    const col = candleColors[i];
    candleWrap.innerHTML += `
      <div class="candle" id="c${i}" onclick="blowOne(${i})">
        <div class="flame" id="f${i}"></div>
        <div class="candle-body" style="background:linear-gradient(180deg,${col},${col}88)"></div>
      </div>`;
  }

  /* ------- Blow ------- */
  function blowOne(i) {
    document.getElementById('c'+i).classList.add('blown');
    checkAllBlown();
  }

  let blown = false;
  function checkAllBlown() {
    const all = document.querySelectorAll('.candle');
    const done = [...all].every(c => c.classList.contains('blown'));
    if (done && !blown) { blown = true; setTimeout(showWish, 400); }
  }

  function blowCandles() {
    document.querySelectorAll('.candle').forEach((c,i) => {
      setTimeout(() => { c.classList.add('blown'); checkAllBlown(); }, i * 200);
    });
  }

  function showWish() {
    document.getElementById('wishPopup').classList.add('show');
    launchBalloons();
  }

  function closeWish() {
    document.getElementById('wishPopup').classList.remove('show');
  }

  /* ------- Balloons ------- */
  const balloonEmojis = ['🎈','🎀','⭐','💛','🌸','🌟','🎊'];
  function launchBalloons() {
    const wrap = document.getElementById('balloons');
    for (let i = 0; i < 18; i++) {
      const b = document.createElement('div');
      b.className = 'balloon';
      const dx = (Math.random()-0.5)*180;
      b.style.cssText = `
        left:${Math.random()*90+5}%;
        --dur:${(Math.random()*3+4).toFixed(1)}s;
        --delay:${(Math.random()*2).toFixed(1)}s;
        --dx:${dx.toFixed(0)}px;
        --rot:${((Math.random()-0.5)*60).toFixed(0)}deg;
      `;
      b.textContent = balloonEmojis[Math.floor(Math.random()*balloonEmojis.length)];
      wrap.appendChild(b);
      setTimeout(() => b.remove(), 9000);
    }
  }
</script>
</body>
</html>
